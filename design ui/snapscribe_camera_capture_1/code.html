<script>
  // Simple interactive feedback behaviors
  const shutterBtn = document.getElementById('shutterBtn');
  const shutterFlash = document.getElementById('shutterFlash');
  const flashToggle = document.getElementById('flashToggle');
  const flashIcon = document.getElementById('flashIcon');
  const flashText = document.getElementById('flashText');
  const gridToggle = document.getElementById('gridToggle');
  const compositionGrid = document.getElementById('compositionGrid');
  const batchToggle = document.getElementById('batchToggle');
  const batchBadge = document.getElementById('batchBadge');
  const batchLabel = document.getElementById('batchLabel');

  // Shutter press tactile feedback simulation
  if (shutterBtn && shutterFlash) {
    shutterBtn.addEventListener('click', () => {
      shutterFlash.classList.remove('opacity-0');
      shutterFlash.classList.add('opacity-80');
      setTimeout(() => {
        shutterFlash.classList.remove('opacity-80');
        shutterFlash.classList.add('opacity-0');
      }, 140);
    });
  }

  // Flash cycle toggle (Auto -> On -> Off)
  const flashStates = [
    { icon: 'flash_auto', label: 'Auto' },
    { icon: 'flash_on', label: 'On' },
    { icon: 'flash_off', label: 'Off' }
  ];
  let currentFlashIndex = 0;

  if (flashToggle) {
    flashToggle.addEventListener('click', () => {
      currentFlashIndex = (currentFlashIndex + 1) % flashStates.length;
      flashIcon.textContent = flashStates[currentFlashIndex].icon;
      flashText.textContent = flashStates[currentFlashIndex].label;
    });
  }

  // Grid composition toggle
  if (gridToggle && compositionGrid) {
    gridToggle.addEventListener('click', () => {
      compositionGrid.classList.toggle('hidden');
    });
  }

  // Mode Pill switching
  const modePills = document.querySelectorAll('.mode-pill');
  modePills.forEach(pill => {
    pill.addEventListener('click', () => {
      modePills.forEach(p => {
        p.classList.remove('bg-primary', 'text-on-primary', 'border-primary/50');
        p.classList.add('bg-surface-container', 'text-on-surface-variant', 'border-outline-variant/30');
      });
      pill.classList.remove('bg-surface-container', 'text-on-surface-variant', 'border-outline-variant/30');
      pill.classList.add('bg-primary', 'text-on-primary', 'border-primary/50');
    });
  });

  // Batch Mode Toggle
  let isBatch = false;
  if (batchToggle && batchBadge && batchLabel) {
    batchToggle.addEventListener('click', () => {
      isBatch = !isBatch;
      if (isBatch) {
        batchBadge.classList.remove('bg-surface-container', 'text-tertiary');
        batchBadge.classList.add('bg-primary-container', 'text-on-primary-container');
        batchLabel.textContent = 'Batch (0)';
      } else {
        batchBadge.classList.remove('bg-primary-container', 'text-on-primary-container');
        batchBadge.classList.add('bg-surface-container', 'text-tertiary');
        batchLabel.textContent = 'Single Slip';
      }
    });
  }
</script></main>
